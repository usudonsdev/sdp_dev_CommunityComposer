name: Deploy on VM Runner

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Deploy branch"
        required: true
        default: "main"
        type: string

jobs:
  deploy:
    runs-on: self-hosted
    concurrency:
      group: vm-deploy
      cancel-in-progress: true
    steps:
      - name: Ensure repository checkout
        shell: bash
        run: |
          set -euo pipefail
          REPO_DIR="${HOME}/sdp_dev_CommunityComposer"
          if [[ ! -d "${REPO_DIR}/.git" ]]; then
            echo "==> Cloning repository to ${REPO_DIR}"
            git clone "https://github.com/${{ github.repository }}.git" "${REPO_DIR}"
          fi
          echo "REPO_DIR=${REPO_DIR}" >> "${GITHUB_ENV}"

      - name: Check for updates
        id: check
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${{ github.event.inputs.branch || 'main' }}"
          cd "${REPO_DIR}"
          git fetch origin "${BRANCH}"
          LOCAL="$(git rev-parse HEAD)"
          REMOTE="$(git rev-parse "origin/${BRANCH}")"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "local=${LOCAL}" >> "$GITHUB_OUTPUT"
          echo "remote=${REMOTE}" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy current checkout
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.has_updates == 'true'
        shell: bash
        env:
          GIT_BRANCH: ${{ steps.check.outputs.branch }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_HOSTED_DOMAIN: ${{ secrets.GOOGLE_HOSTED_DOMAIN }}
          AUTH_ADMIN_SECRET: ${{ secrets.AUTH_ADMIN_SECRET }}
          AUTH_MOCK_ENABLED: ${{ secrets.AUTH_MOCK_ENABLED }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          FLASK_ENV: ${{ secrets.FLASK_ENV }}
          FLASK_DEBUG: ${{ secrets.FLASK_DEBUG }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          MAGIC_LINK_EXPIRE_MINUTES: ${{ secrets.MAGIC_LINK_EXPIRE_MINUTES }}
          AUTH_MAGIC_LINK_ENABLED: ${{ secrets.AUTH_MAGIC_LINK_ENABLED }}
          AUTH_ADMIN_EMAILS: ${{ secrets.AUTH_ADMIN_EMAILS }}
        run: |
          set -euo pipefail
          cd "${REPO_DIR}"
          chmod +x scripts/vm-deploy.sh
          SKIP_GIT_PULL=0 bash scripts/vm-deploy.sh

      - name: No updates
        if: github.event_name != 'workflow_dispatch' && steps.check.outputs.has_updates != 'true'
        shell: bash
        run: echo "No updates detected on origin/${{ steps.check.outputs.branch }}."
