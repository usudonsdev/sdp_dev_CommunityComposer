name: Flask App CI (Test Automation)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHubリポジトリからコードをチェックアウト
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. .env ファイルのダミーを作成（エラー回避用）
      - name: Create dummy .env file
        run: |
          echo "FLASK_ENV=testing" >> .env
          echo "GOOGLE_CLIENT_ID=dummy-id" >> .env
          echo "SECRET_KEY=dummy-secret" >> .env

      # 3. Docker Compose をバックグラウンド（画面なし）で起動 (docker-compose -> docker compose に修正)
      - name: Start Docker containers
        run: docker compose up -d --build

      # 4. コンテナが完全に立ち上がるまで少し待つ（安全策）
      - name: Wait for services to be ready
        run: sleep 5

      # 5. コンテナ内で自動テストを実行（docker-compose -> docker compose に修正）
      - name: Run Pytest in Container
        run: docker compose exec -T -e PYTHONPATH=/app web python -m pytest tests --import-mode=importlib

      # 6. テストが終わったらコンテナを綺麗にお片付け（docker-compose -> docker compose に修正）
      - name: Stop Docker containers
        run: docker compose down