services:
  # バックエンドAPI（現状の設定を維持）
  web:
    build: .
    ports:
      - "8000:5000"
    volumes:
      - .:/app
    environment:
      FLASK_APP: run.py
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_HOSTED_DOMAIN: ${GOOGLE_HOSTED_DOMAIN:-shibaura-it.ac.jp}
      ADMIN_LOGIN_SECRET: ${AUTH_ADMIN_SECRET:-admin-secret-change-me}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-1}
      MAGIC_LINK_EXPIRE_MINUTES: ${MAGIC_LINK_EXPIRE_MINUTES:-15}
    command: flask --app run.py run --host=0.0.0.0 --port=5000 --no-reload
    restart: unless-stopped

  # UIフロントエンドを新しく追加！
  ui:
    build: .
    ports:
      - "8080:5000" # ホスト側の8080番ポートで画面を開けるようにする
    volumes:
      - .:/app
    environment:
      FLASK_APP: latest_folder_codex/implementation/a_ui_flask/wsgi.py
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      # バックエンドAPIの場所（コンテナ間通信用のURL）をUIに教えてあげる
      COMMUNITY_SERVICE_BASE_URL: http://web:5000
      AUTH_SERVICE_BASE_URL: http://web:5000
      REQUIRE_AUTH_TOKEN: "1"
      AUTH_MOCK_ENABLED: ${AUTH_MOCK_ENABLED:-}
      SECRET_KEY: ${SECRET_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_HOSTED_DOMAIN: ${GOOGLE_HOSTED_DOMAIN:-shibaura-it.ac.jp}
      AUTH_ADMIN_SECRET: ${AUTH_ADMIN_SECRET:-admin-secret-change-me}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      GOOGLE_OAUTH_ADMIN_REDIRECT_URI: ${GOOGLE_OAUTH_ADMIN_REDIRECT_URI:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_FROM: ${SMTP_FROM:-}
    command: flask --app latest_folder_codex/implementation/a_ui_flask/wsgi.py run --host=0.0.0.0 --port=5000 --no-reload
    restart: unless-stopped

  # 公開 HTTPS URL が必要なとき: docker-compose --profile tunnel up -d
  # ログに表示された URL を PUBLIC_BASE_URL と Google Console に登録する
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://ui:5000
    depends_on:
      - ui